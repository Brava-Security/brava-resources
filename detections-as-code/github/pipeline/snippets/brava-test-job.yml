# Option 1 of "Add Brava's injection test to a deploy workflow you already have": https://docs.brava.security/hygiene/detection-as-code/
# Not a complete workflow: merge these jobs into your existing deploy workflow.
jobs:
  deploy-dev:              # your existing Dev upload job
    outputs:
      rules: ${{ steps.upload.outputs.rules }}
    steps:
      # ... your existing steps. At the end of the step that uploads (id: upload), add:
      #   echo "rules=<deployed rule IDs or names, space-separated>" >> "$GITHUB_OUTPUT"

  brava-test:
    needs: deploy-dev
    runs-on: ubuntu-latest
    env:
      BRAVA_API_TOKEN: ${{ secrets.BRAVA_API_TOKEN }}
      BRAVA_URL: https://console.brava.security
      BRAVA_SIEM: SecOps Dev
      BRAVA_TEST_GATE: ${{ vars.BRAVA_TEST_GATE || 'warn' }}
      RULES: ${{ needs.deploy-dev.outputs.rules }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "brava-cli==0.4.0"
      - run: brava doctor
      - name: Test the deployed rules
        run: |
          set -euo pipefail
          blocked=0
          {
            echo "### Brava detection tests (gate: $BRAVA_TEST_GATE)"
            echo "| Rule | Result |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for rule in $RULES; do
            echo "::group::Verify $rule"
            rc=0
            if id=$(brava run test create --siem "$BRAVA_SIEM" --rule "$rule" --json | jq -er .id); then
              brava run test watch "$id" --fail-on high || rc=$?
            else
              rc=1
            fi
            echo "::endgroup::"
            case "$rc" in
              0) result="passed" ;;
              2) result="did not pass: the rule did not fire, a check failed, or a finding reached --fail-on" ;;
              4) result="no answer: inconclusive or not telemetry-driven" ;;
              3) result="timed out" ;;
              *) result="could not run (exit $rc)" ;;
            esac
            echo "| \`$rule\` | $result |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$rc" -ne 0 ]; then
              if [ "$BRAVA_TEST_GATE" = block ]; then
                echo "::error::Brava test of $rule: $result"
                blocked=1
              else
                echo "::warning::Brava test of $rule: $result (not blocking Prod: BRAVA_TEST_GATE=warn)"
              fi
            fi
          done
          exit "$blocked"

  deploy-prod:             # your existing Prod job, if it is in this workflow
    needs: [deploy-dev, brava-test]
